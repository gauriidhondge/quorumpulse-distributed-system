apiVersion: apps/v1
kind: Deployment
metadata:
  name: request-service
spec:
  replicas: 1
  selector:
    matchLabels: {app: request-service}
  template:
    metadata:
      labels: {app: request-service}
    spec:
      containers:
        - name: request-service
          image: blood-network:latest
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "request_service.main:app", "--host", "0.0.0.0", "--port", "8000"]
          env:
            - {name: REDIS_HOST, value: "redis"}
            - {name: PUNE_HOST, value: "node-pune"}
            - {name: MUMBAI_HOST, value: "node-mumbai"}
            - {name: NASHIK_HOST, value: "node-nashik"}
            - {name: SERVERLESS_GATEWAY_HOST, value: "serverless-gateway"}
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: request-service
spec:
  selector: {app: request-service}
  type: NodePort
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: serverless-gateway
spec:
  replicas: 1
  selector:
    matchLabels: {app: serverless-gateway}
  template:
    metadata:
      labels: {app: serverless-gateway}
    spec:
      containers:
        - name: serverless-gateway
          image: blood-network:latest
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "serverless.gateway:app", "--host", "0.0.0.0", "--port", "8095"]
          ports:
            - containerPort: 8095
---
apiVersion: v1
kind: Service
metadata:
  name: serverless-gateway
spec:
  selector: {app: serverless-gateway}
  ports:
    - port: 8095
      targetPort: 8095
